<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <meta name="description" content="トックトック — あなたに得なことをネットから探す。" />
  <title>トックトック</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icon-192.png" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero" id="hero">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">得</div>
        <div>
          <h1>トックトック</h1>
          <p>あなたに得なことだけ、見つけます。</p>
        </div>
      </div>

      <form id="searchForm" class="search-row" autocomplete="off">
        <label class="search-box" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" name="q" type="search" maxlength="80" placeholder="何がお得だと嬉しいですか？" aria-label="お得情報を検索" />
          <button id="clearBtn" class="clear-btn" type="button" aria-label="入力を消す" hidden>×</button>
        </label>
        <button class="primary-btn" type="submit">探す</button>
      </form>

      <div class="secondary-actions">
        <button id="randomBtn" class="random-btn" type="button"><span aria-hidden="true">◈</span> RANDOM</button>
        <button id="locationBtn" class="ghost-btn location-btn" type="button" aria-pressed="false"><span aria-hidden="true">◎</span> 現在地を使う</button>
        <button id="forYouBtn" class="ghost-btn" type="button" hidden>FOR YOU</button>
      </div>

      <div id="locationStatus" class="location-status" hidden></div>
      <p class="microcopy" id="privacyNote">検索語・閲覧・保存はこの端末で好みの順位づけに使われます。位置情報は現在地検索のときだけ使い、端末には保存しません。APIキーはBYOKです。</p>
    </section>

    <section id="status" class="status" aria-live="polite" hidden></section>

    <section id="resultsSection" class="results-section" hidden>
      <div class="results-head">
        <div>
          <span class="eyebrow" id="resultMode">RESULTS</span>
          <h2 id="resultTitle">見つかった得</h2>
        </div>
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="もう一度探す">↻</button>
      </div>
      <div id="results" class="cards"></div>
    </section>

    <section id="savedSection" class="saved-section" hidden>
      <div class="results-head">
        <div>
          <span class="eyebrow">SAVED</span>
          <h2>保存した情報</h2>
        </div>
      </div>
      <div id="savedResults" class="cards compact"></div>
    </section>

    <footer>
      <div class="footer-left">
        <button id="savedBtn" class="footer-btn" type="button">保存一覧 <span id="savedCount">0</span></button>
        <button id="apiKeyBtn" class="footer-link key-status" type="button">API KEY</button>
      </div>
      <button id="resetBtn" class="footer-link" type="button">好みをリセット</button>
    </footer>
  </main>

  <dialog id="apiKeyDialog" class="key-dialog">
    <form id="apiKeyForm" class="key-panel" method="dialog">
      <div class="key-head">
        <div>
          <span class="eyebrow">BYOK</span>
          <h2>OpenAI APIキー</h2>
        </div>
        <button id="apiKeyClose" class="icon-btn" type="button" aria-label="閉じる">×</button>
      </div>
      <p class="key-copy">あなた自身のAPIキーを使って検索します。キーはこの端末のブラウザに保存され、検索時にOpenAI APIへ中継されます。CloudflareのSecretには保存しません。</p>
      <label class="key-input-wrap" for="apiKeyInput">
        <span>API KEY</span>
        <input id="apiKeyInput" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-..." />
      </label>
      <div class="key-actions">
        <button id="apiKeySave" class="primary-btn" type="submit">この端末に保存</button>
        <button id="apiKeyDelete" class="ghost-btn" type="button">削除</button>
      </div>
      <p class="microcopy">共有PCでは保存しないでください。削除すると、この端末からキーを消去します。</p>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="deal-card">
      <div class="card-topline">
        <span class="kind-badge"></span>
        <span class="score-badge"></span>
      </div>
      <h3 class="deal-title"></h3>
      <p class="deal-summary"></p>
      <div class="meta-row">
        <span class="deadline"></span>
        <span class="condition"></span>
        <span class="area" hidden></span>
      </div>
      <div class="source-row"></div>
      <div class="card-actions">
        <button class="action-btn save-btn" type="button">保存</button>
      </div>
    </article>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
